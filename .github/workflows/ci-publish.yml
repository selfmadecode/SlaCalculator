name: CI / Build and Publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

  pull_request:
    branches:
      - master

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Only create the NuGet package when a version tag is pushed
      - name: Pack SlaCore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          echo "Packing SlaCore version $VERSION"

          mkdir -p artifacts

          dotnet pack src/SlaCore/SlaCore.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:PackageVersion=$VERSION

      # Exchange GitHub OIDC token for a temporary NuGet API key
      - name: NuGet login
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Publish to NuGet.org
      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Publishing packages:"
          ls -la artifacts

          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate